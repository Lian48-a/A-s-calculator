<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماشین حساب</title>
<style>
:root{--bg:#eef1ec;--panel:#fbfcf9;--ink:#1d2a24;--key:#e3e8e0;--op:#2f6f5e;--opink:#fff;--eq:#d9822b;--muted:#6b7a72;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--panel:#1b2620;--ink:#e8efe9;--key:#27352d;--op:#3d8c77;--muted:#8fa196}}
:root[data-theme="dark"]{--bg:#121a16;--panel:#1b2620;--ink:#e8efe9;--key:#27352d;--op:#3d8c77;--muted:#8fa196}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.screen{direction:ltr;text-align:right;padding:8px 6px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hist{color:var(--muted);font-size:15px;min-height:20px;word-break:break-all}
.cur{font-size:44px;font-weight:600;line-height:1.1;word-break:break-all}
.keys{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:22px;border:0;border-radius:14px;padding:16px 0;background:var(--key);color:var(--ink);cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
button.op{background:var(--op);color:var(--opink)}
button.eq{background:var(--eq);color:#fff;grid-column:span 2}
button.wide{grid-column:span 2}
</style>
</head>
<body>
<main class="calc">
  <div class="screen"><div class="hist" id="hist"></div><div class="cur" id="cur">0</div></div>
  <div class="keys">
    <button data-a="clear" class="op">C</button>
    <button data-a="back" class="op">⌫</button>
    <button data-a="op" data-v="÷" class="op">÷</button>
    <button data-a="op" data-v="×" class="op">×</button>
    <button data-a="num">7</button><button data-a="num">8</button><button data-a="num">9</button>
    <button data-a="op" data-v="-" class="op">−</button>
    <button data-a="num">4</button><button data-a="num">5</button><button data-a="num">6</button>
    <button data-a="op" data-v="+" class="op">+</button>
    <button data-a="num">1</button><button data-a="num">2</button><button data-a="num">3</button>
    <button data-a="dot">.</button>
    <button data-a="num" class="wide">0</button>
    <button data-a="eq" class="eq">=</button>
  </div>
</main>
<script>
var cur="0",prev=null,op=null,fresh=false;
var curEl=document.getElementById("cur"),histEl=document.getElementById("hist");
function calc(a,b,o){a=parseFloat(a);b=parseFloat(b);
  if(o==="+")return a+b; if(o==="-")return a-b; if(o==="×")return a*b;
  if(o==="÷")return b===0?null:a/b; return b;}
function fmt(n){if(n===null)return "تقسیم بر صفر";
  return String(parseFloat(n.toPrecision(12)));}
function show(){curEl.textContent=cur;
  curEl.style.fontSize=cur.length>10?"28px":"44px";
  histEl.textContent=prev!==null&&op?prev+" "+op:"";}
function press(a,v){
  if(cur==="تقسیم بر صفر"){cur="0";prev=null;op=null;}
  if(a==="num"){ if(fresh||cur==="0"){cur=v;fresh=false;} else if(cur.length<15)cur+=v; }
  else if(a==="dot"){ if(fresh){cur="0.";fresh=false;} else if(cur.indexOf(".")<0)cur+="."; }
  else if(a==="back"){ if(!fresh){cur=cur.length>1?cur.slice(0,-1):"0";} }
  else if(a==="clear"){cur="0";prev=null;op=null;fresh=false;}
  else if(a==="op"){
    if(op&&!fresh){var r=calc(prev,cur,op);cur=fmt(r);if(r===null){prev=null;op=null;show();return;}}
    prev=cur;op=v;fresh=true;
  }
  else if(a==="eq"){
    if(op){var r2=calc(prev,cur,op);histEl.textContent=prev+" "+op+" "+cur+" =";
      cur=fmt(r2);prev=null;op=null;fresh=true;curEl.textContent=cur;
      curEl.style.fontSize=cur.length>10?"28px":"44px";return;}
  }
  show();
}
document.querySelector(".keys").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  press(b.dataset.a,b.dataset.v||b.textContent);
});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(/^[0-9]$/.test(k))press("num",k);
  else if(k===".")press("dot");
  else if(k==="+"||k==="-")press("op",k);
  else if(k==="*"||k==="x")press("op","×");
  else if(k==="/"){e.preventDefault();press("op","÷");}
  else if(k==="Enter"||k==="="){e.preventDefault();press("eq");}
  else if(k==="Backspace")press("back");
  else if(k==="Escape")press("clear");
});
</script>
</body>
</html>
